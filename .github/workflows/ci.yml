name: macOS

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Apple Silicon · macOS 27
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
          test "$(uname -m)" = arm64
      - name: Test
        run: swift test
      - name: Build and validate direct distribution
        run: |
          ./scripts/build-app.sh
          ./scripts/validate-app.sh 'build/One Clipboard History.app'
      - name: Build sandboxed Store archive without distribution credentials
        run: ./scripts/archive-store.sh --unsigned
      - name: Archive bundles while preserving executable permissions
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'build/One Clipboard History.app' build/one-clipboard-history-local.zip
          ditto -c -k --sequesterRsrc --keepParent 'build/One Clipboard History Store.xcarchive' build/one-clipboard-history-store-archive.zip
      - name: Retain local test bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: One-Clipboard-History-local-builds
          path: |
            build/one-clipboard-history-local.zip
            build/one-clipboard-history-store-archive.zip
          if-no-files-found: error
          retention-days: 7
