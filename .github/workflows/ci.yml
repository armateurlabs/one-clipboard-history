name: macOS

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate:
    name: Apple Silicon · macOS 27
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata and tag
        env:
          OCH_REF_TYPE: ${{ github.ref_type }}
          OCH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$OCH_REF_TYPE" == tag ]]; then
            python3 scripts/release_metadata.py --tag "$OCH_REF_NAME"
          else
            python3 scripts/release_metadata.py
          fi
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
          test "$(uname -m)" = arm64
      - name: Test
        run: |
          python3 -m unittest discover -s scripts/tests -v
          swift test
      - name: Build and validate direct distribution
        run: |
          ./scripts/build-app.sh
          ./scripts/validate-app.sh 'build/One Clipboard History.app'
      - name: Build sandboxed Store archive without distribution credentials
        run: ./scripts/archive-store.sh --unsigned
      - name: Package and round-trip validate the release
        env:
          OCH_REF_TYPE: ${{ github.ref_type }}
          OCH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$OCH_REF_TYPE" == tag ]]; then
            python3 scripts/package_release.py --app 'build/One Clipboard History.app' --tag "$OCH_REF_NAME"
          else
            python3 scripts/package_release.py --app 'build/One Clipboard History.app'
          fi
      - name: Retain the verified release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: One-Clipboard-History-release
          path: build/release/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Archive the sandbox prototype
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'build/One Clipboard History Store.xcarchive' build/one-clipboard-history-store-archive.zip
      - name: Retain the sandbox prototype
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: One-Clipboard-History-store-prototype
          path: build/one-clipboard-history-store-archive.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the package from the successful validation job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: One-Clipboard-History-release
          path: build/release
      - name: Verify, upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
          OCH_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/publish_release.py --package build/release \
            --repo "$GITHUB_REPOSITORY" --tag "$OCH_RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)"
